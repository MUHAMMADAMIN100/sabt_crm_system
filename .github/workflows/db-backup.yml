name: Daily PostgreSQL backup

# Каждый день в 02:00 UTC = 07:00 в Душанбе.
# Ручной запуск — кнопка "Run workflow" во вкладке Actions на GitHub.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Запрещаем параллельные запуски: если предыдущий бэкап ещё идёт,
# новый дождётся завершения.
concurrency:
  group: db-backup
  cancel-in-progress: false

# Backup only needs to read repository metadata and upload an Actions artifact.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required backup secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            {
              echo "## ❌ Database backup is not configured"
              echo
              echo 'Required Actions secret `DATABASE_URL` is missing.'
              echo
              echo "Add it at **Repository Settings → Secrets and variables → Actions → New repository secret**, then run this workflow manually."
              echo
              echo "The value was not printed to the log."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Database backup is not configured::Required Actions secret DATABASE_URL is missing. Add it in Repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Backup configuration preflight passed; the secret value was not logged." >> "$GITHUB_STEP_SUMMARY"

      - name: Install PostgreSQL 16 client (matches Railway version)
        # apt-key устарел (15.11.2026): ключ репозитория кладём отдельным
        # файлом и привязываем только к pgdg через signed-by — как советует
        # сам PostgreSQL. Ключ не становится доверенным для всех репозиториев.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATE=$(date -u +%Y-%m-%d_%H%M)
          FILE="backup-${DATE}.sql"
          echo "Dumping to ${FILE}..."
          pg_dump "$DATABASE_URL" \
            --no-owner --no-acl --clean --if-exists \
            --format=plain \
            > "${FILE}"
          gzip "${FILE}"
          gzip -t "${FILE}.gz"
          ls -lh "${FILE}.gz"
          # Sanity-check: бэкап не должен быть < 1KB (обычно > 100KB)
          SIZE=$(stat -c%s "${FILE}.gz")
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Backup file is suspiciously small (${SIZE} bytes). Possible auth or connectivity issue."
            exit 1
          fi
          echo "BACKUP_FILE=${FILE}.gz" >> "$GITHUB_ENV"

      # Полная копия базы (зарплаты, клиенты, пароли-хеши) не должна лежать
      # артефактом в открытом виде (15.11.2026): её скачает любой с доступом к
      # Actions. Есть секрет BACKUP_PASSPHRASE — шифруем AES-256 и выкладываем
      # только .gpg. Нет — предупреждаем и ведём себя как раньше.
      # Расшифровка: gpg --decrypt backup-….sql.gz.gpg | gunzip > backup.sql
      - name: Encrypt backup (when BACKUP_PASSPHRASE is set)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::warning title=Backup is not encrypted::Actions secret BACKUP_PASSPHRASE is not set — the dump is uploaded as plain gzip. Add the secret to encrypt backups."
            echo "⚠️ Backup uploaded WITHOUT encryption: secret \`BACKUP_PASSPHRASE\` is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "${BACKUP_FILE}.gpg" "${BACKUP_FILE}"
          # Проверяем, что зашифрованный файл расшифровывается в целый gzip.
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt "${BACKUP_FILE}.gpg" | gzip -t
          rm -f "${BACKUP_FILE}"
          ls -lh "${BACKUP_FILE}.gpg"
          echo "BACKUP_FILE=${BACKUP_FILE}.gpg" >> "$GITHUB_ENV"
          echo "🔒 Backup encrypted with AES-256 (gpg symmetric)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backup as artifact (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish failure diagnostics
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          {
            echo
            echo "## Failure diagnostics"
            echo
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "- Cause: required Actions secret \`DATABASE_URL\` is missing."
            else
              echo "- \`DATABASE_URL\` is present; inspect the failed step for PostgreSQL connectivity, credentials, or storage errors."
            fi
            echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- No database credentials were written to the log."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Daily database backup failed::Open the workflow summary for a safe diagnostic and remediation steps."
