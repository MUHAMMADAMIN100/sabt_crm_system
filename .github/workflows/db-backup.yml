name: Daily PostgreSQL backup

# Каждый день в 02:00 UTC = 07:00 в Душанбе.
# Ручной запуск — кнопка "Run workflow" во вкладке Actions на GitHub.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Запрещаем параллельные запуски: если предыдущий бэкап ещё идёт,
# новый дождётся завершения.
concurrency:
  group: db-backup
  cancel-in-progress: false

# Backup only needs to read repository metadata and upload an Actions artifact.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required backup secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            {
              echo "## ❌ Database backup is not configured"
              echo
              echo 'Required Actions secret `DATABASE_URL` is missing.'
              echo
              echo "Add it at **Repository Settings → Secrets and variables → Actions → New repository secret**, then run this workflow manually."
              echo
              echo "The value was not printed to the log."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Database backup is not configured::Required Actions secret DATABASE_URL is missing. Add it in Repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Backup configuration preflight passed; the secret value was not logged." >> "$GITHUB_STEP_SUMMARY"

      - name: Install PostgreSQL 16 client (matches Railway version)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATE=$(date -u +%Y-%m-%d_%H%M)
          FILE="backup-${DATE}.sql"
          echo "Dumping to ${FILE}..."
          pg_dump "$DATABASE_URL" \
            --no-owner --no-acl --clean --if-exists \
            --format=plain \
            > "${FILE}"
          gzip "${FILE}"
          gzip -t "${FILE}.gz"
          ls -lh "${FILE}.gz"
          # Sanity-check: бэкап не должен быть < 1KB (обычно > 100KB)
          SIZE=$(stat -c%s "${FILE}.gz")
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Backup file is suspiciously small (${SIZE} bytes). Possible auth or connectivity issue."
            exit 1
          fi
          echo "BACKUP_FILE=${FILE}.gz" >> "$GITHUB_ENV"

      - name: Upload backup as artifact (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish failure diagnostics
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          {
            echo
            echo "## Failure diagnostics"
            echo
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "- Cause: required Actions secret \`DATABASE_URL\` is missing."
            else
              echo "- \`DATABASE_URL\` is present; inspect the failed step for PostgreSQL connectivity, credentials, or storage errors."
            fi
            echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- No database credentials were written to the log."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Daily database backup failed::Open the workflow summary for a safe diagnostic and remediation steps."
